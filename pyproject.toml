[project]
name = "tankuos"
version = "2.0.0"
description = "TankuOS v2 — Retro desktop on curses"
requires-python = ">=3.10"

[project.scripts]
tankuos = "tankuos.shell:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
